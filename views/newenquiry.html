<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Enquiry — Agnel Polytechnic</title>
    <link rel="stylesheet" href="Enquirystyle.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .neq-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .neq-card {
            background: var(--card-bg, #fff);
            border: 1px solid rgba(31,41,55,0.1);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .neq-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .neq-card-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark, #111);
        }
        .neq-card-dept {
            font-size: 0.78rem;
            background: var(--primary, #1ca37e);
            color: #fff;
            border-radius: 6px;
            padding: 2px 9px;
            white-space: nowrap;
        }
        .neq-card-row {
            font-size: 0.88rem;
            color: var(--muted, #666);
            margin: 4px 0;
        }
        .neq-card-row span {
            color: var(--text-dark, #111);
            font-weight: 500;
        }
        .neq-assigned-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.8rem;
            background: #f0f9f6;
            border: 1px solid #b8e0d4;
            border-radius: 6px;
            padding: 3px 10px;
            color: #1ca37e;
        }
        .neq-edit-btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px 0;
            background: var(--primary, #1ca37e);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .neq-edit-btn:hover { background: #158a68; }

        /* Edit Modal */
        .neq-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .neq-modal-overlay.open { display: flex; }
        .neq-modal {
            background: #fff;
            border-radius: 14px;
            padding: 28px 24px;
            width: 90%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        .neq-modal h3 {
            margin: 0 0 18px;
            font-size: 1.15rem;
        }
        .neq-modal .form-group {
            margin-bottom: 14px;
        }
        .neq-modal .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--muted, #666);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .neq-modal .form-group input,
        .neq-modal .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .neq-modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .neq-modal-footer button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .neq-modal-save { background: var(--primary, #1ca37e); color: #fff; }
        .neq-modal-save:hover { background: #158a68; }
        .neq-modal-cancel { background: #f3f4f6; color: #374151; }
        .neq-modal-cancel:hover { background: #e5e7eb; }

        .neq-empty {
            color: var(--muted, #888);
            padding: 16px 0;
            font-size: 0.95rem;
        }

        @media (max-width: 600px) {
            .neq-cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Agnel Polytechnic Vashi</div>
        <div class="nav-right">
            <span style="font-size:0.9rem;color:var(--muted,#666);margin-right:10px;">Newenquiry</span>
            <a href="/logout" class="tab-btn" style="text-decoration:none;">Logout</a>
        </div>
    </nav>

    <main class="content">

        <!-- Enquiry Form -->
        <div class="card" id="neq-form-card">
            <h3>Add New Enquiry</h3>
            <form id="enquiryForm">
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">
                    <div class="form-group">
                        <label class="input-label">Student Name *</label>
                        <input type="text" id="studentName" class="remark-select" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Phone Number *</label>
                        <input type="tel" id="phoneNO" class="remark-select" placeholder="10-digit number" required>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Department *</label>
                        <select id="department" class="remark-select" required>
                            <option value="">Select Department</option>
                            <option value="AN">AN</option>
                            <option value="TE">TE</option>
                            <option value="CE">CE</option>
                            <option value="ME">ME</option>
                            <option value="AE">AE</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Percentage</label>
                        <input type="number" id="percentage" class="remark-select" placeholder="e.g. 75.5" min="0" max="100" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="input-label">Board</label>
                        <select id="board" class="remark-select">
                            <option value="">Select Board</option>
                            <option value="SSC">SSC (Maharashtra State Board)</option>
                            <option value="ITI">ITI (Industrial Training Institute)</option>
                            <option value="CBSE">CBSE</option>
                            <option value="ICSE">ICSE / ISC</option>
                            <option value="HSC">HSC (Maharashtra State Board)</option>
                            <option value="NIOS">NIOS</option>
                            <option value="IB">IB (International Baccalaureate)</option>
                            <option value="Cambridge">Cambridge IGCSE</option>
                            <option value="Other State Board">Other State Board</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="input-label">Caste</label>
                        <input type="text" id="caste" class="remark-select" placeholder="Category">
                    </div>
                    <div class="form-group">
                        <label class="input-label">Annual Income</label>
                        <input type="number" id="annual_income" class="remark-select" placeholder="In rupees">
                    </div>
                    <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:22px;">
                        <input type="checkbox" id="isManagement" style="width:18px;height:18px;">
                        <label for="isManagement" style="font-size:0.9rem;margin:0;">Management Quota</label>
                    </div>
                    <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:22px;">
                        <input type="checkbox" id="isDirectSecondYear" style="width:18px;height:18px;">
                        <label for="isDirectSecondYear" style="font-size:0.9rem;margin:0;">Direct 2nd Year Admission</label>
                    </div>
                </div>
                <div style="margin-top:16px;">
                    <button type="submit" class="primary-btn" id="submitBtn">Submit Enquiry</button>
                    <span class="success-msg" id="formSuccess">Submitted!</span>
                </div>
            </form>
        </div>

        <!-- My Submitted Enquiries -->
        <div class="card" id="neq-list-card">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:4px;">
                <h3 style="margin:0;">My Submitted Enquiries</h3>
                <button class="action-btn" onclick="loadMyEnquiries()">Refresh</button>
            </div>
            <div id="my-enquiries-container">
                <p class="neq-empty">Loading…</p>
            </div>
        </div>

    </main>

    <!-- Edit Modal -->
    <div class="neq-modal-overlay" id="editModal" onclick="closeEditModal(event)">
        <div class="neq-modal">
            <h3>Edit Enquiry</h3>
            <input type="hidden" id="edit-original-name">
            <div class="form-group">
                <label>Student Name *</label>
                <input type="text" id="edit-student-name">
            </div>
            <div class="form-group">
                <label>Phone Number *</label>
                <input type="tel" id="edit-phone">
            </div>
            <div class="form-group">
                <label>Department *</label>
                <select id="edit-department">
                    <option value="AN">AN</option>
                    <option value="TE">TE</option>
                    <option value="CE">CE</option>
                    <option value="ME">ME</option>
                    <option value="AE">AE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Percentage</label>
                <input type="number" id="edit-percentage" min="0" max="100" step="0.01">
            </div>
            <div class="form-group">
                <label>Board</label>
                <select id="edit-board">
                    <option value="">— Not set —</option>
                    <option value="SSC">SSC (Maharashtra State Board)</option>
                    <option value="ITI">ITI (Industrial Training Institute)</option>
                    <option value="CBSE">CBSE</option>
                    <option value="ICSE">ICSE / ISC</option>
                    <option value="HSC">HSC (Maharashtra State Board)</option>
                    <option value="NIOS">NIOS</option>
                    <option value="IB">IB (International Baccalaureate)</option>
                    <option value="Cambridge">Cambridge IGCSE</option>
                    <option value="Other State Board">Other State Board</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Caste</label>
                <input type="text" id="edit-caste">
            </div>
            <div class="form-group">
                <label>Annual Income</label>
                <input type="number" id="edit-income">
            </div>
            <div class="neq-modal-footer">
                <button class="neq-modal-save" onclick="saveEdit()">Save Changes</button>
                <button class="neq-modal-cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="mobile-bottom-nav">
        <button class="mob-nav-btn active" onclick="document.getElementById('neq-form-card').scrollIntoView({behavior:'smooth'})">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span>Add Enquiry</span>
        </button>
        <button class="mob-nav-btn" onclick="document.getElementById('neq-list-card').scrollIntoView({behavior:'smooth'})">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>My Enquiries</span>
        </button>
        <button class="mob-nav-btn" onclick="window.location.href='/logout'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Logout</span>
        </button>
    </nav>

    <script src="newenquiry.js"></script>
</body>
</html>
