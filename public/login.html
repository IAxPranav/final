<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnel Polytechnic Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="login-card-inner">
            <div class="login-card-head">
                <span>Sign In</span>
                <h2>Staff Portal</h2>
                <p>Access your dashboard and manage student follow-ups securely.</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="********" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility()">Show</span>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="login-btn">Sign In</button>

                <div class="form-footer">
                    <a href="#">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
